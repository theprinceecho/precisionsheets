<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact • PrecisionSheets</title>
    <meta name="description" content="Get in touch with PrecisionSheets. Questions about Excel templates, FP&A dashboards, or custom solutions? We reply within 24 hours." />
    <link rel="canonical" href="https://precisionsheets.info/contact" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/theprinceecho/precisionsheets/main/PS_Logo_new.jpg" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a1628;
            color: #ffffff;
            line-height: 1.65;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 66px;
            background: rgba(10, 22, 40, 0.96);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 200;
            border-bottom: 1px solid rgba(212, 175, 119, 0.08);
        }

        .nav-logo {
            height: 34px;
            border-radius: 8px;
            margin-right: 12px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 36px;
            font-size: 0.95rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            padding-bottom: 6px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #d4af77;
        }

        .language-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #d4af77;
            background: rgba(212, 175, 119, 0.08);
            padding: 6px 14px;
            border-radius: 9999px;
            border: 1px solid rgba(212, 175, 119, 0.2);
        }

        .main-content {
            padding-top: 120px;
            padding-bottom: 80px;
            max-width: 1080px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
            color: #d4af77;
        }

        .form-container {
            padding: 0 40px;
            max-width: 920px;
            margin: 0 auto;
        }

        .form-spacer {
            height: 80px;
        }

        @media (max-width: 480px) {
            .nav { padding: 0 20px; }
            .nav-links { gap: 18px; }
            .main-content {
                padding-top: 140px;
                padding-bottom: 55px;
            }
            h1 { font-size: 2.55rem; margin-bottom: 22px; }
            .form-container { padding: 0 20px; padding-bottom: 16px; }
            iframe { width: 100% !important; max-width: 100% !important; }
            .form-spacer { height: 30px; }
        }

        .footer {
            margin-top: 0;
            padding-top: 60px;
            padding-bottom: 70px;
            text-align: center;
            font-size: 0.9rem;
            color: #ffffff;
            opacity: 0.85;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            line-height: 1.8;
            background: #11253a;
        }

        .footer a { color: #ffffff !important; text-decoration: none; }
        .footer-line1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .copyright { font-size: 0.85rem; opacity: 0.7; margin-top: 20px; }
    </style>
</head>
<body>
    <nav class="nav">
        <div style="display: flex; align-items: center;">
            <a href="index.html">
                <img src="https://raw.githubusercontent.com/theprinceecho/precisionsheets/main/PS_Logo_new.jpg" 
                     alt="PrecisionSheets" class="nav-logo" />
            </a>
            
            <div class="nav-links">
                <a href="index.html">About</a>
                <a href="index.html#find">Discover</a>
                <a href="index.html#templates">Templates</a>
            </div>
        </div>

        <div class="language-indicator">
            🇺🇸 <span>US</span>
        </div>
    </nav>

    <div class="main-content">
        <h1>Contact</h1>
        <p style="font-size: 1.2rem; opacity: 0.92; max-width: 420px; margin: 0 auto 60px; line-height: 1.5; color: #ffffff;">
            A direct line for those who value precision.
        </p>
       
        <div class="form-container">
            <iframe src="https://tally.so/embed/GxY5lj?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
                    width="100%"
                    height="1600"
                    frameborder="0"
                    scrolling="no"
                    style="border: none; background: transparent; display: block;">
            </iframe>
        </div>

        <div class="form-spacer"></div>
    </div>

    <div class="footer">
        <div class="footer-line1">
            <span>High-precision tools for serious finance teams</span>
        </div>
        <div>
            <a href="legal.html">Legal disclosure</a>
            <span style="margin:0 12px;opacity:0.6">•</span>
            <a href="contact.html">Contact</a>
        </div>
        <div class="copyright">Copyright © 2026 PrecisionSheets • All rights reserved.</div>
    </div>
</body>
</html>
