<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PrecisionSheets • Contact</title>
    <meta name="description" content="Get in touch with PrecisionSheets.">
    <link rel="canonical" href="https://precisionsheets.info/contact" />
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/theprinceecho/precisionsheets/main/PS_Logo_new.jpg">
  
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
     
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0a1628;
            background-image:
                linear-gradient(rgba(212,175,119,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212,175,119,0.025) 1px, transparent 1px);
            background-size: 100% 32px, 100% 100%;
        }
      
        .nav { position: fixed; top: 0; left: 0; right: 0; height: 60px; background: rgba(10, 22, 40, 0.95); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 100; }
        .nav-logo { height: 32px; cursor: pointer; border-radius: 8px; overflow: hidden; border: 2px solid rgba(212,175,119,0.4); }
        .nav-links { display: flex; align-items: center; gap: 32px; font-size: 0.95rem; }
        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            padding-bottom: 6px;
            transition: color 0.2s ease;
        }
        .nav-links a.active { color: #d4af77; }
        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #d4af77;
            opacity: 0.9;
        }
     
        .section { padding: 100px 24px 80px; width: 100%; }
        #contact { background: #0a1628; }
      
        .contact-container {
            max-width: 720px;
            margin: 0 auto;
        }
      
        .contact-container h1 { 
            font-size: 2.4rem; 
            margin-bottom: 16px; 
            letter-spacing: -1.2px; 
            color: #d4af77; 
            text-align: center;
        }
      
        .contact-container p { 
            text-align: center; 
            max-width: 520px; 
            margin: 0 auto 40px; 
            line-height: 1.6; 
            color: #e0e0e0;
        }
      
        .footer {
            margin-top: 0;
            padding-top: 60px;
            padding-bottom: 70px;
            text-align: center;
            font-size: 0.9rem;
            color: #ffffff;
            opacity: 0.85;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            line-height: 1.8;
            background: #11253a;
        }
        .footer a { color: #ffffff !important; text-decoration: none; }
        .footer-line1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .copyright { font-size: 0.85rem; opacity: 0.7; margin-top: 8px; }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html"><img src="https://raw.githubusercontent.com/theprinceecho/precisionsheets/main/PS_Logo_new.jpg" alt="PrecisionSheets" class="nav-logo"></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#products">Products & Services</a>
        </div>
    </nav>

    <section id="contact" class="section">
        <div class="contact-container">
            <h1>Contact</h1>
            <p>Have a question or want to discuss a custom project? Reach out using the form below.</p>
            
            <!-- Tally Form Embed -->
            <iframe 
                src="https://tally.so/embed/your-form-id" 
                width="100%" 
                height="600" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">
            </iframe>
            
            <!-- Spacer to reduce empty space before footer -->
            <div style="height: 48px;"></div>
            
        </div>
    </section>

    <div class="footer">
        <div class="footer-line1">
            <span>High-precision tools for serious finance teams</span>
        </div>
        <div>
            <a href="legal.html">Legal disclosure</a>
            <span style="margin:0 12px;opacity:0.6">•</span>
            <a href="contact.html">Contact</a>
        </div>
        <div class="copyright">Copyright © 2026 PrecisionSheets • All rights reserved.</div>
    </div>

</body>
</html>
